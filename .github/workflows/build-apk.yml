name: Build APK

on:
  push:
    branches: [feature/fix-recording]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd app/tabs
          npx react-native install
          cd ..
          npm ci

      - name: Typecheck (disabled for CI)
        run: |
          cd app/tabs
          pnpm typecheck --noTypeCheck

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: build/outputs/apk/debug/
